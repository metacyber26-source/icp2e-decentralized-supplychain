<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Pi Network</title>
    <!-- Pi Network SDK Version 2.0 -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-pay {
            background-color: #f59e0b;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-pay:hover {
            background-color: #d97706;
        }
        .btn-pay:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
        #status-box {
            margin-top: 15px;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Integrasi Pi Payment</h2>
    <p id="user-info">Memuat & Autentikasi User Pi...</p>

    <button id="pay-btn" class="btn-pay" onclick="handlePayButtonClick()" disabled>
        Bayar dengan Pi
    </button>

    <div id="status-box">Menghubungkan ke Pi SDK...</div>
</div>

<script>
    // Inisialisasi Pi SDK
    // Ubah sandbox: false jika sudah rilis di Mainnet
    Pi.init({ version: "2.0", sandbox: true });

    let currentUser = null;

    // 1. Autentikasi Otomatis & Penanganan Pembayaran Gantung Saat Halaman Dimuat
    async function authenticateUser() {
        const statusBox = document.getElementById("status-box");
        const userInfo = document.getElementById("user-info");
        const payBtn = document.getElementById("pay-btn");

        try {
            const scopes = ['username', 'payments'];
            
            // Mengirim fungsi onIncompletePaymentFound untuk memulihkan transaksi kedaluwarsa/gantung
            const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
            currentUser = auth.user;

            userInfo.textContent = `Selamat datang, @${currentUser.username}!`;
            statusBox.textContent = "Siap melakukan transaksi.";
            payBtn.disabled = false;
            
            console.log("User terautentikasi:", currentUser.username);
        } catch (error) {
            console.error("Gagal autentikasi Pi:", error);
            userInfo.textContent = "Gagal terhubung ke Pi Browser.";
            statusBox.textContent = "Buka aplikasi ini dari dalam Pi Browser.";
        }
    }

    // 2. Fungsi Penanganan Transaksi Gantung (Mencegah Status Kedaluwarsa)
    function onIncompletePaymentFound(payment) {
        console.log("Ditemukan transaksi tertunda/incomplete:", payment.identifier);
        const statusBox = document.getElementById("status-box");
        statusBox.textContent = "Menyelesaikan transaksi tertunda sebelumnya...";

        // Mengirim txid transaksi gantung ke backend agar diselesaikan
        return fetch('/api/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                paymentId: payment.identifier, 
                txid: payment.transaction ? payment.transaction.txid : null 
            })
        })
        .then(res => res.json())
        .then(data => {
            console.log("Pembayaran tertunda berhasil diselesaikan:", data);
            statusBox.textContent = "Transaksi tertunda sebelumnya telah diselesaikan!";
        })
        .catch(err => {
            console.error("Gagal menyelesaikan pembayaran tertunda:", err);
            statusBox.textContent = "Gagal memulihkan transaksi tertunda.";
        });
    }

    // 3. Pemicu Tombol Bayar
    function handlePayButtonClick() {
        if (!currentUser) {
            alert("User belum terautentikasi.");
            return;
        }
        
        // Contoh pembayaran 1 Pi
        createPiPayment(1.0, "Pembelian Aset Digital iNFT", { orderId: "ORDER_" + Date.now() });
    }

    // 4. Eksekusi Pembayaran Baru (Pi.createPayment)
    async function createPiPayment(amount, memo, metadata) {
        const statusBox = document.getElementById("status-box");
        const payBtn = document.getElementById("pay-btn");

        payBtn.disabled = true;
        statusBox.textContent = "Memproses instruksi pembayaran...";

        const paymentData = {
            amount: amount,
            memo: memo,
            metadata: metadata || {}
        };

        const callbacks = {
            // Callback 1: Server Approval
            onReadyForServerApproval: function(paymentId) {
                console.log("Menunggu Server Approval untuk ID:", paymentId);
                statusBox.textContent = "Menyetujui transaksi di server backend...";

                fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId: paymentId })
                })
                .then(res => res.json())
                .then(data => {
                    console.log("Server Approval Berhasil:", data);
                    statusBox.textContent = "Persetujuan backend berhasil. Silakan konfirmasi di Pi Wallet...";
                })
                .catch(err => {
                    console.error("Error Server Approval:", err);
                    statusBox.textContent = "Gagal mendapatkan persetujuan backend.";
                    payBtn.disabled = false;
                });
            },

            // Callback 2: Server Completion
            onReadyForServerCompletion: function(paymentId, txid) {
                console.log("Menunggu Server Completion untuk TXID:", txid);
                statusBox.textContent = "Menyelesaikan validasi di blockchain...";

                fetch('/api/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId: paymentId, txid: txid })
                })
                .then(res => res.json())
                .then(data => {
                    console.log("Server Completion Berhasil:", data);
                    statusBox.textContent = "🎉 Pembayaran Berhasil Selesai!";
                    alert("🎉 Transaksi Pi Berhasil!");
                    payBtn.disabled = false;
                })
                .catch(err => {
                    console.error("Error Server Completion:", err);
                    statusBox.textContent = "Gagal menyelesaikan proses transaksi akhir.";
                    payBtn.disabled = false;
                });
            },

            // Callback 3: Pembatalan Pengguna
            onCancel: function(paymentId) {
                console.log("Pembayaran dibatalkan:", paymentId);
                statusBox.textContent = "Pembayaran dibatalkan oleh pengguna.";
                payBtn.disabled = false;
            },

            // Callback 4: Error Transaksi
            onError: function(error, payment) {
                console.error("Terjadi error transaksi Pi:", error);
                statusBox.textContent = "Terjadi kesalahan pada transaksi.";
                payBtn.disabled = false;
            }
        };

        try {
            await Pi.createPayment(paymentData, callbacks);
        } catch (err) {
            console.error("Gagal memicu Pi.createPayment:", err);
            statusBox.textContent = "Gagal membuka jendela pembayaran Pi.";
            payBtn.disabled = false;
        }
    }

    // Jalankan autentikasi otomatis begitu halaman selesai dimuat
    window.addEventListener('DOMContentLoaded', authenticateUser);
</script>

</body>
</html>
